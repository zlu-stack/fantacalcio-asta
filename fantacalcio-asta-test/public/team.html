<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Crencrew League 2026 — Offerte</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0a1e;--panel:#1c1640;--accent:#00e6b8;--gold:#facc15;--text:#f8fafc;--muted:#94a3b8;--danger:#f43f5e;--line:rgba(255,255,255,.08);--p:#facc15;--d:#34d399;--c:#60a5fa;--a:#fb7185}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h2,h3{font-family:Montserrat,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 24px}
.offer.blocked{opacity:.45;pointer-events:none;filter:grayscale(.2)}
.slot-msg{background:rgba(244,63,94,.12);color:var(--danger);border:1px solid rgba(244,63,94,.25);border-radius:8px;padding:8px;font-weight:800;font-size:12px;margin-top:8px;text-align:center;text-transform:uppercase}
.slot-msg.hidden{display:none}
.card{background:linear-gradient(135deg,#1a103e,#1c1640);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.card.auction.leading{background:linear-gradient(135deg,rgba(0,230,184,.14),#1c1640);border-color:rgba(0,230,184,.35)}
.card.auction.trailing{background:linear-gradient(135deg,rgba(244,63,94,.12),#1c1640);border-color:rgba(244,63,94,.30)}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 20px}
.brand svg{height:26px}
select,input[type=number]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0c0a1e;color:var(--text);font-size:15px}
.btn{border:none;border-radius:10px;padding:12px 16px;font-weight:900;font-family:Montserrat,sans-serif;cursor:pointer}
.btn-accent{background:var(--accent);color:#062e26}
.btn:disabled{opacity:.35;cursor:default}
.auction{text-align:center}
.photo{width:180px;height:220px;border-radius:12px;object-fit:contain;object-position:center bottom;background:transparent;display:block;margin:0 auto 12px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.45))}
.photo.hidden-img{visibility:hidden}
.pill{display:inline-block;padding:4px 10px;border-radius:20px;font-weight:900;font-size:11px;letter-spacing:.6px;color:#000}
.pill.P{background:var(--p)} .pill.D{background:var(--d)} .pill.C{background:var(--c)} .pill.A{background:var(--a)}
.name{font-size:24px;font-weight:900;margin:6px 0 2px}
.meta{color:var(--muted);font-size:13px}
.bidrow{display:flex;gap:10px;justify-content:center;margin:12px 0 6px}
.bidrow > div{flex:0 0 40%;max-width:40%;text-align:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60px;gap:4px;box-sizing:border-box}
.bidrow > div:last-child{flex:0 0 calc(60% - 10px);max-width:calc(60% - 10px);background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.06);padding:12px 8px;min-width:0;box-sizing:border-box}
.bidrow .v{font-size:22px;font-weight:900;color:var(--accent);line-height:1}
.bidrow > div:last-child .v{font-size:18px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bidrow .k{font-size:10px;letter-spacing:.7px;color:var(--muted);text-transform:uppercase;font-weight:700}
.timer{font-size:36px;font-weight:900;color:var(--gold);margin:6px 0}
.timer.danger{color:var(--danger)}
.timer.hidden-t{visibility:hidden}
.status{margin-top:6px;padding:8px;border-radius:8px;font-weight:800;font-size:12px;text-transform:uppercase}
.status.win{background:rgba(0,230,184,.12);color:var(--accent);border:1px solid rgba(0,230,184,.2)}
.status.lose{background:rgba(244,63,94,.1);color:var(--danger);border:1px solid rgba(244,63,94,.2)}
.offer{margin-top:12px}
.plus-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.plus-row .btn{padding:12px 6px;font-size:14px}
.custom{display:flex;gap:8px;margin-top:8px}
.custom input{flex:1}
.custom .go{background:var(--gold);color:#1a1400;border:none;border-radius:10px;padding:12px 16px;font-weight:900;font-family:Montserrat;cursor:pointer;text-transform:uppercase}
.custom .go:disabled{opacity:.35}
.msg{min-height:16px;color:var(--danger);font-size:12px;margin-top:6px;text-align:center;text-transform:uppercase}
.squad-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.squad-head b{font-size:14px}
.squad-head .cr{color:var(--accent);font-weight:900}
.turn-banner{text-align:center;padding:22px 14px;background:linear-gradient(135deg,rgba(0,230,184,.16),#1c1640);border:1px solid rgba(0,230,184,.4);border-radius:14px;margin-bottom:12px}
.turn-banner .tb-label{font-size:11px;letter-spacing:1.5px;color:var(--accent);font-weight:800;text-transform:uppercase}
.turn-banner .tb-role{font-size:28px;font-weight:900;margin:6px 0 10px;font-family:Montserrat,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px}
.turn-banner .tb-role .role-dot{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#000;flex-shrink:0}
.turn-banner .tb-role .role-dot.P{background:var(--p)} .turn-banner .tb-role .role-dot.D{background:var(--d)} .turn-banner .tb-role .role-dot.C{background:var(--c)} .turn-banner .tb-role .role-dot.A{background:var(--a)}
.turn-banner .tb-stats{display:flex;justify-content:center;gap:20px;font-size:12px;color:var(--muted);font-weight:700}
.turn-banner .tb-stats b{color:var(--text);font-size:14px}
.waiting-box{padding:28px 20px;background:linear-gradient(135deg,rgba(0,230,184,.10),#1c1640);border:1px solid rgba(0,230,184,.30);border-radius:16px;margin-bottom:16px;text-align:center}
.waiting-box .wb-label{font-size:11px;letter-spacing:1.5px;color:var(--accent);font-weight:800;text-transform:uppercase}
.waiting-box .wb-team{font-size:28px;font-weight:900;color:var(--text);margin:6px 0;font-family:Montserrat,sans-serif;line-height:1}
.waiting-box .wb-role{display:flex;align-items:center;justify-content:center;gap:8px;font-size:20px;font-weight:800;color:var(--text);margin-top:8px}
.waiting-box .wb-role .role-dot{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#000;flex-shrink:0}
.waiting-box .wb-role .role-dot.P{background:var(--p)} .waiting-box .wb-role .role-dot.D{background:var(--d)} .waiting-box .wb-role .role-dot.C{background:var(--c)} .waiting-box .wb-role .role-dot.A{background:var(--a)}
.waiting-box .wb-icon{font-size:26px;margin-bottom:8px}
.waiting-box b{color:var(--text)}
.call-list{margin-bottom:16px}
.call-list h3{font-size:12px;margin-bottom:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:800}
.cl-search-row{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.cl-search{flex:1;padding:10px 12px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);font-size:13px}
.cl-team-select{flex:0 0 140px;padding:10px 12px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);font-size:13px;height:39px}
.cl-team-select option{background:#0c0a1e;color:var(--text)}
.cl-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cl-fpill{flex-shrink:0;padding:6px 12px;border-radius:20px;font-weight:800;font-size:11px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.cl-fpill.active{background:var(--text);color:#000;border-color:var(--text)}
.cl-fpill.active.P{background:var(--p);color:#000;border-color:var(--p)}
.cl-fpill.active.D{background:var(--d);color:#000;border-color:var(--d)}
.cl-fpill.active.C{background:var(--c);color:#000;border-color:var(--c)}
.cl-fpill.active.A{background:var(--a);color:#000;border-color:var(--a)}
.cl-fpill.all.active{background:var(--text);color:#000}
.cl-rows{max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px}
.cl-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;background:#0c0a1e;border:1px solid var(--line);cursor:pointer;transition:background .15s}
.cl-row:active{background:rgba(0,230,184,.1)}
.cl-row.disabled{opacity:.45;cursor:default}
.cl-row .l{display:flex;align-items:center;gap:8px;min-width:0}
.cl-row .nm{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-row .sq{font-size:10.5px;color:var(--muted)}
.cl-row .fvm{color:var(--gold);font-weight:800;font-size:12px;flex-shrink:0}
.team-slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0 14px;text-align:center}
.team-slots .s{font-size:10px;font-weight:800;background:rgba(255,255,255,.06);border-radius:8px;padding:7px 2px;border:1px solid transparent}
.team-slots .s.low{color:var(--muted)}
.team-slots .s.ok{background:rgba(0,230,184,.12);color:var(--accent);border-color:rgba(0,230,184,.18)}
.team-slots .s.full{background:rgba(0,230,184,.2);color:var(--accent);border-color:rgba(0,230,184,.35)}
.group{margin-bottom:10px}
.group-h{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.chip{display:flex;justify-content:space-between;align-items:center;background:#0c0a1e;border:1px solid var(--line);border-radius:7px;padding:6px 7px;margin-bottom:3px;font-size:12px}
.chip .pr{color:var(--gold);font-weight:800}
.empty{color:var(--muted);font-size:12px;font-style:italic;padding:4px}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><svg viewBox="0 0 260 32" height="26"><text x="0" y="11" fill="#fff" font-family="Montserrat,Arial" font-weight="800" font-size="10" letter-spacing="2">CRENCREW</text><text x="0" y="26" fill="#fff" font-family="Montserrat,Arial" font-weight="900" font-size="13" letter-spacing="1">LEAGUE 2026</text><circle cx="246" cy="16" r="11" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M246 7 v5 M246 20 v5 M236 16 h5 M252 16 h5" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/><circle cx="246" cy="16" r="3.2" fill="none" stroke="#fff" stroke-width="1.2"/></svg></div>
  <div id="selectScreen" class="card">
    <h3 style="font-size:14px;margin-bottom:8px">Scegli la tua squadra</h3>
    <select id="teamSelect"></select>
    <button class="btn btn-accent" style="width:100%;margin-top:10px" onclick="chooseTeam()">Entra</button>
  </div>
  <div id="mainScreen" class="hidden">
    <div id="teamLanding" class="waiting-box hidden" style="flex-direction:column;align-items:center;gap:16px;padding:36px 24px 32px;display:flex">
      <div class="wb-label" style="color:var(--accent);font-size:12px;letter-spacing:3px">FANTACALCIO 2026</div>
      <div class="wb-team" style="font-size:38px;line-height:0.9;color:var(--text);font-family:Montserrat,sans-serif;font-weight:900;letter-spacing:.5px">CRENCREW<br>LEAGUE</div>
      <div style="width:48px;height:2px;background:var(--accent);opacity:.5;border-radius:2px;margin:4px 0"></div>
      <div style="color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;line-height:1.5;text-align:center">In attesa dell'inizio dell'asta</div>
    </div>
    <div id="turnBanner" class="turn-banner hidden">
      <div class="tb-label">è il tuo turno</div>
      <div class="tb-role"><span class="role-dot" id="tbRoleDot">—</span><span id="tbRoleName">—</span></div>
      <div class="tb-stats">
        <span>Slot <b id="tbSlots">0/0</b></span>
        <span>Budget <b id="tbBudget">0</b></span>
        <span>Max <b id="tbMax">0</b></span>
      </div>
    </div>

    <div id="waitingBox" class="waiting-box hidden">
      <div class="wb-label">prossima chiamata</div>
      <div class="wb-team" id="wbTeamName">—</div>
      <div class="wb-role"><span class="role-dot" id="wbRoleDot">—</span><span id="wbRoleName">—</span></div>
    </div>

    <div class="card auction hidden" id="auctionCard">
      <div style="color:var(--muted);font-size:11px;letter-spacing:.6px;font-weight:700;margin-bottom:6px" id="roleInfo">In attesa...</div>
      <div id="emptyState" style="color:var(--muted);padding:16px 0;font-size:13px">Nessun giocatore in asta</div>
      <div id="filledState" class="hidden">
        <img id="playerPhoto" class="photo" src="" alt="">
        <span class="pill" id="rolePill">A</span>
        <div class="name" id="playerName">—</div>
        <div class="meta" id="playerMeta"></div>
        <div class="bidrow"><div><div class="v" id="currentBid">0</div><div class="k">Offerta</div></div><div id="bidderBox"><div class="v" id="currentBidder">—</div><div class="k">miglior offerta</div></div></div>
        <div class="timer hidden-t" id="timer">--</div>
        <div id="myStatus" class="status hidden"></div>
        <div class="offer" id="offerBox">
          <div class="plus-row">
            <button class="btn btn-accent" id="plus1Btn" onclick="bidPlus(1)">+1</button>
            <button class="btn btn-accent" id="plus5Btn" onclick="bidPlus(5)">+5</button>
            <button class="btn btn-accent" id="plus10Btn" onclick="bidPlus(10)">+10</button>
          </div>
          <div class="custom"><input type="number" id="customAmount" placeholder="Importo libero" min="1"><button class="go" id="customBtn" onclick="bidCustom()">OFFRI</button></div>
          <div class="msg" id="msg"></div>
          <div id="slotMsg" class="slot-msg hidden">SLOT ESAURITI PER QUESTO RUOLO</div>
        </div>
      </div>
    </div>

    <div class="card call-list" id="callListCard">
      <h3 id="callListTitle">Giocatori disponibili</h3>
      <div class="cl-search-row">
        <input type="text" class="cl-search" id="clSearch" placeholder="Cerca giocatore, squadra..." oninput="renderCallList()">
        <select class="cl-team-select" id="clTeamSelect" onchange="setClFilter(this.value||null)"><option value="">Squadra</option></select>
      </div>
      <div class="cl-filters" id="clFilters"></div>
      <div class="cl-rows" id="clRows"></div>
      <div id="clCount" style="margin-top:10px;font-size:11px;color:var(--muted);text-align:center"></div>
    </div>

    <div class="card">
      <div class="squad-head"><b id="myTeamName" style="align-self:center">—</b><div style="text-align:right;line-height:1.3"><div style="font-size:11px;color:var(--muted);font-weight:600">BUDGET <span id="myCredits" style="color:var(--accent);font-weight:800">0</span></div><div style="font-size:11px;color:var(--muted);font-weight:600">MAX <span id="myMax" style="color:var(--gold);font-weight:800">0</span></div></div></div>
      <div id="mySlotsBar" class="team-slots"></div>
      <div id="mySquad"></div>
    </div>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
(function(){
  const socket = io();
  let myTeam = null;
  try { myTeam = localStorage.getItem('fantacalcio_team') || null; } catch(e){}
  let latest = null;
  const ROLE_NAMES={P:'Portieri',D:'Difensori',C:'Centrocampisti',A:'Attaccanti'};
  const ROLES=['P','D','C','A'];
  let ROLE_SLOTS={P:3,D:8,C:8,A:6};
  let ROLE_MIN={P:3,D:8,C:8,A:6};
  async function loadTeams(){
    try{
      const r=await fetch('/team-names');
      const n=await r.json();
      const sel=document.getElementById('teamSelect');
      if(!sel) return;
      sel.innerHTML=n.map(x=>'<option value="'+x+'">'+x+'</option>').join('');
      if(myTeam && n.includes(myTeam)) enterMain();
    }catch(e){ console.error('loadTeams',e); }
  }
  loadTeams();
  window.chooseTeam=function(){
    const sel=document.getElementById('teamSelect');
    myTeam=sel.value;
    try{ localStorage.setItem('fantacalcio_team',myTeam); }catch(e){}
    enterMain();
  };
  function enterMain(){
    const a=document.getElementById('selectScreen'), b=document.getElementById('mainScreen');
    if(a) a.classList.add('hidden');
    if(b) b.classList.remove('hidden');
    const el=document.getElementById('myTeamName');
    if(el) el.textContent=myTeam||'—';
  }
  function setMsg(t){
    const e=document.getElementById('msg');
    if(!e) return;
    e.textContent=t;
    if(t) setTimeout(()=>{ if(e.textContent===t) e.textContent=''; },3000);
  }
  let clFilter=null;
  let clRoleFilter=null;
  function renderClFilters(){
    const sel=document.getElementById('clTeamSelect'); if(sel){
      const opts=['<option value="">Squadra</option>'].concat((window._squadreReali||[]).map(function(sq){ return '<option value="'+sq.replace(/"/g,'&quot;')+'"'+(clFilter===sq?' selected':'')+'>'+sq+'</option>'; }));
      sel.innerHTML=opts.join('');
      if(clFilter && !(window._squadreReali||[]).includes(clFilter)) { clFilter=null; sel.value=''; }
      else if(clFilter) sel.value=clFilter;
    }
    const el=document.getElementById('clFilters'); if(el){
      const isPreStart = latest && !latest.auctionStarted && !latest.auctionFinished;
      if(isPreStart){
        el.style.display='flex';
        const roles=['P','D','C','A'];
        el.innerHTML='<div class="cl-fpill all '+(!clRoleFilter?'active':'')+'" onclick="setClRoleFilter(null)">Tutti</div>'+roles.map(function(r){ return '<div class="cl-fpill '+r+' '+(clRoleFilter===r?'active':'')+'" onclick="setClRoleFilter(\''+r+'\')">'+r+'</div>'; }).join('');
      } else {
        el.style.display='none';
        el.innerHTML='';
      }
    }
  }
  window.setClFilter=function(sq){ clFilter=sq||null; const sel=document.getElementById('clTeamSelect'); if(sel) sel.value=clFilter||''; renderCallList(); };
  window.setClRoleFilter=function(r){ clRoleFilter=r||null; renderClFilters(); renderCallList(); };
   window.renderCallList=function(){
      if(!latest) return;
      const box=document.getElementById('clRows'); if(!box) return;
      const isPreStart = !latest.auctionStarted && !latest.auctionFinished;
      const q=(document.getElementById('clSearch')?.value||'').toLowerCase();
      let list=[];
      let squadre=[];
      if(isPreStart){
        // pre-asta: tutti i giocatori non assegnati, filtrabili per ruolo/squadra/ricerca
        list=(latest.allPlayers||[]).filter(function(p){ return !latest.assigned[p.id]; });
        if(clRoleFilter) list=list.filter(function(p){ return p.ruolo===clRoleFilter; });
        squadre=[...new Set(list.map(function(p){return p.squadra;}))].filter(Boolean).sort();
        window._squadreReali=squadre;
        if(clFilter) list=list.filter(function(p){return p.squadra===clFilter;});
        if(q) list=list.filter(function(p){ return p.nome.toLowerCase().includes(q) || (p.squadra||'').toLowerCase().includes(q); });
        list=list.sort(function(a,b){ return (b.valutazione||0)-(a.valutazione||0); });
        const countEl=document.getElementById('clCount'); if(countEl) countEl.textContent=list.length+' giocatori • scorri per sfogliare';
        box.innerHTML=list.slice(0,400).map(function(p){
          return '<div class="cl-row" style="cursor:default;opacity:1">'+
            '<div class="l"><span class="pill '+p.ruolo+'" style="font-size:8px;padding:2px 6px">'+p.ruolo+'</span><div><div class="nm">'+p.nome+'</div><div class="sq">'+(p.squadra||'')+'</div></div></div>'+
            '<span class="fvm">'+(p.valutazione??'')+'</span></div>';
        }).join('') || '<div class="empty">Nessun giocatore disponibile</div>';
        return;
      }
      const role=latest.currentRole;
      list=(latest.allPlayers||[]).filter(function(p){ return p.ruolo===role && !latest.assigned[p.id]; });
      squadre=[...new Set(list.map(function(p){return p.squadra;}))].filter(Boolean).sort();
      window._squadreReali=squadre;
      if(clFilter) list=list.filter(function(p){return p.squadra===clFilter;});
      if(q) list=list.filter(function(p){ return p.nome.toLowerCase().includes(q) || (p.squadra||'').toLowerCase().includes(q); });
      list=list.sort(function(a,b){ return (b.valutazione||0)-(a.valutazione||0); });
      const countEl2=document.getElementById('clCount'); if(countEl2) countEl2.textContent='';
       const hasPending = !!latest.pendingSelection;
       const isMyPending = hasPending && latest.pendingSelection.callerTeam===myTeam;
       const canCall = myTeam && latest.currentCallerTeam===myTeam && !latest.currentAuction && (!hasPending || isMyPending);
       const pendingId = isMyPending ? latest.pendingSelection.player.id : null;
      box.innerHTML=list.slice(0,300).map(function(p){
        const isPendingSel = pendingId && String(p.id)===String(pendingId);
        return '<div class="cl-row'+(canCall?'':' disabled')+(isPendingSel?' style="border-color:var(--gold);background:rgba(250,204,21,.12)"':'')+'" onclick="'+(canCall?"callPlayer('"+p.id+"')":'')+'">'+
          '<div class="l"><span class="pill '+p.ruolo+'" style="font-size:8px;padding:2px 6px">'+p.ruolo+'</span><div><div class="nm">'+p.nome+(isPendingSel?' <span style="color:var(--gold);font-size:10px">● selezionato</span>':'')+'</div><div class="sq">'+(p.squadra||'')+'</div></div></div>'+
          '<span class="fvm">'+(p.valutazione??'')+'</span></div>';
      }).join('') || '<div class="empty">Nessun giocatore disponibile</div>';
    };
  window.callPlayer=function(playerId){
    fetch('/call-player',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({playerId:playerId, team:myTeam})})
      .then(function(r){return r.json();})
      .then(function(d){ if(!d.ok) setMsg(d.error||'Errore'); });
  };
   window.bidPlus=function(delta){
     if(!latest) return;
     if(latest.pendingSelection && latest.pendingSelection.callerTeam===myTeam && !latest.currentAuction){
       // prima offerta che avvia l'asta: parte da delta (min 1)
       doBid(delta);
       return;
     }
     if(!latest.currentAuction) return;
     const a=(latest.currentAuction.currentBid||0)+delta;
     doBid(a);
   };
  window.bidCustom=function(){
    const inp=document.getElementById('customAmount');
    const v=Number(inp?inp.value:0);
    if(!v||v<1) return setMsg('Inserisci importo valido');
    doBid(v);
  };
  function doBid(amount){
    socket.emit('bid',{team:myTeam,amount},function(r){
      if(!r || !r.ok) setMsg(r?r.error:'Errore');
      else {
        const inp=document.getElementById('customAmount');
        if(inp) inp.value='';
      }
    });
  }
  socket.on('state', function(s){
    try{
      latest=s;
      if(s.roleSlots) ROLE_SLOTS=s.roleSlots;
      if(s.roleMin) ROLE_MIN=s.roleMin;
      const ri=document.getElementById('roleInfo');
      if(ri) ri.textContent=s.currentRoleName? s.currentRoleName : (s.auctionFinished?'Asta terminata':'In attesa...');

      // pre-start: prima del click su "Inizia asta" l'asta non può cominciare
      const isPreStart = !s.auctionStarted && !s.auctionFinished;
      const teamLanding=document.getElementById('teamLanding');
      if(teamLanding){
        if(isPreStart) teamLanding.classList.remove('hidden');
        else teamLanding.classList.add('hidden');
      }
      // ---- Orchestrazione banner turno / attesa / asta / pending ----
      const turnBanner=document.getElementById('turnBanner'), waitingBox=document.getElementById('waitingBox'), auctionCard=document.getElementById('auctionCard');
      const myTforTurn = s.teams ? s.teams.find(function(t){return t.name===myTeam;}) : null;
      if(isPreStart){
        if(turnBanner) turnBanner.classList.add('hidden');
        if(waitingBox) waitingBox.classList.add('hidden');
        if(auctionCard) auctionCard.classList.add('hidden');
        const clcB=document.getElementById('callListCard'); if(clcB) clcB.classList.remove('hidden');
      } else if(s.currentAuction){
        if(turnBanner) turnBanner.classList.add('hidden');
        if(waitingBox) waitingBox.classList.add('hidden');
        if(auctionCard) auctionCard.classList.remove('hidden');
      } else if(s.pendingSelection){
        // selezione pendente: non è ancora asta finché il chiamante non offre — nascondi giocatore alle altre squadre
        if(s.pendingSelection.callerTeam===myTeam){
          // sei tu il chiamante: vedi l'asta in pending e puoi ancora cambiare giocatore dalla lista
          if(turnBanner) turnBanner.classList.add('hidden');
          if(waitingBox) waitingBox.classList.add('hidden');
          if(auctionCard) auctionCard.classList.remove('hidden');
        } else {
          // un altro ha selezionato: non mostrare il giocatore, ma mostra prossima chiamata + ruolo
          if(turnBanner) turnBanner.classList.add('hidden');
          if(waitingBox) waitingBox.classList.remove('hidden');
          const wt=document.getElementById('wbTeamName'); if(wt) wt.textContent=s.pendingSelection.callerTeam;
          const wr2=document.getElementById('wbRoleName'); if(wr2) wr2.textContent=(s.callerInfo&&s.callerInfo.roleName)||s.currentRoleName||s.pendingSelection.player.ruolo||'—';
          const wd2=document.getElementById('wbRoleDot'); if(wd2){ const r=(s.callerInfo&&s.callerInfo.role)||s.currentRole||s.pendingSelection.player.ruolo||''; wd2.textContent=r||'—'; wd2.className='role-dot '+r; }
          if(auctionCard) auctionCard.classList.add('hidden');
        }
      } else if(s.currentCallerTeam===myTeam && !s.auctionFinished){
        if(turnBanner) turnBanner.classList.remove('hidden');
        if(waitingBox) waitingBox.classList.add('hidden');
        if(auctionCard) auctionCard.classList.add('hidden');
        const rn=document.getElementById('tbRoleName'); if(rn) rn.textContent=(s.callerInfo&&s.callerInfo.roleName)||s.currentRoleName||'—';
        const rd=document.getElementById('tbRoleDot'); if(rd){ const r=(s.callerInfo&&s.callerInfo.role)||s.currentRole||''; rd.textContent=r||'—'; rd.className='role-dot '+r; }
        const sl=document.getElementById('tbSlots'); if(sl && s.callerInfo) sl.textContent=s.callerInfo.filled+'/'+s.callerInfo.max;
        const bd=document.getElementById('tbBudget'); if(bd && myTforTurn) bd.textContent=myTforTurn.credits;
        const mx=document.getElementById('tbMax'); if(mx && myTforTurn){
          const totalMin=Object.values(ROLE_MIN).reduce((a,b)=>a+b,0);
          const remaining=totalMin - myTforTurn.squad.length;
          const maxVal=Math.max(0, myTforTurn.credits - Math.max(0, remaining - 1));
          mx.textContent=maxVal;
        }
      } else if(s.currentCallerTeam && !s.auctionFinished){
        if(turnBanner) turnBanner.classList.add('hidden');
        if(waitingBox) waitingBox.classList.remove('hidden');
        if(auctionCard) auctionCard.classList.add('hidden');
        const wt=document.getElementById('wbTeamName'); if(wt) wt.textContent=s.currentCallerTeam;
        const wr=document.getElementById('wbRoleName'); if(wr) wr.textContent=(s.callerInfo&&s.callerInfo.roleName)||s.currentRoleName||'—';
        const wd=document.getElementById('wbRoleDot'); if(wd){ const r=(s.callerInfo&&s.callerInfo.role)||s.currentRole||''; wd.textContent=r||'—'; wd.className='role-dot '+r; }
      } else {
        if(turnBanner) turnBanner.classList.add('hidden');
        if(waitingBox) waitingBox.classList.add('hidden');
        if(auctionCard) auctionCard.classList.remove('hidden');
      }
      const callListTitle=document.getElementById('callListTitle');
      const callListCard=document.getElementById('callListCard');
      if(isPreStart){
        if(callListCard) callListCard.classList.remove('hidden');
        if(callListTitle) callListTitle.textContent='giocatori disponibili';
      }
      else if(s.auctionFinished){ if(callListCard) callListCard.classList.add('hidden'); }
      else {
        if(callListCard) callListCard.classList.remove('hidden');
        if(callListTitle) callListTitle.textContent=(s.currentRoleName||'')+' Disponibili';
      }
      renderCallList();
      renderClFilters();

      const empty=document.getElementById('emptyState'), filled=document.getElementById('filledState');
      const myT=s.teams ? s.teams.find(function(t){return t.name===myTeam;}) : null;
      let blocked=false;
      if(myT && s.currentAuction){
        const cur=s.currentAuction.player.ruolo;
        const cnt=myT.squad.filter(function(p){return p.ruolo===cur;}).length;
        blocked=cnt>= (ROLE_SLOTS[cur]||99);
      } else if(myT && s.pendingSelection){
        const cur=s.pendingSelection.player.ruolo;
        // solo il chiamante può offrire per avviare; gli altri sono bloccati finché non parte l'asta
        if(s.pendingSelection.callerTeam!==myTeam) blocked=true;
        else {
          const cnt=myT.squad.filter(function(p){return p.ruolo===cur;}).length;
          blocked=cnt>= (ROLE_SLOTS[cur]||99);
        }
      }
      const offerBox=document.getElementById('offerBox');
      if(offerBox) offerBox.classList.toggle('blocked', !!blocked);
      ['plus1Btn','plus5Btn','plus10Btn','customBtn'].forEach(function(id){
        const el=document.getElementById(id);
        if(el) el.disabled=!!blocked;
      });
      const ca=document.getElementById('customAmount');
      if(ca) ca.disabled=!!blocked;
      const sm=document.getElementById('slotMsg');
      if(sm) sm.classList.toggle('hidden', !blocked);
      // auction card color
      const auctionCardEl=document.getElementById('auctionCard');
      const bidderBox=document.getElementById('bidderBox');
      if(auctionCardEl){
        auctionCardEl.classList.remove('leading','trailing');
        if(myT && s.currentAuction){
          if(s.currentAuction.currentBidder===myTeam) auctionCardEl.classList.add('leading');
          else if(s.currentAuction.currentBidder) auctionCardEl.classList.add('trailing');
        }
      }
      if(bidderBox){
        bidderBox.classList.remove('leading','trailing');
        if(myT && s.currentAuction){
          if(s.currentAuction.currentBidder===myTeam) bidderBox.classList.add('leading');
          else if(s.currentAuction.currentBidder) bidderBox.classList.add('trailing');
        }
      }
      if(s.currentAuction){
        if(empty) empty.classList.add('hidden');
        if(filled) filled.classList.remove('hidden');
        const p=s.currentAuction.player;
        const img=document.getElementById('playerPhoto');
        if(img){
          if(p.card){ img.src=p.card; img.classList.remove('hidden-img'); img.onerror=function(){ img.classList.add('hidden-img'); }; } else img.classList.add('hidden-img');
        }
        const pill=document.getElementById('rolePill');
        if(pill){ pill.textContent=p.ruolo; pill.className='pill '+p.ruolo; }
        const pn=document.getElementById('playerName');
        if(pn) pn.textContent=p.nome;
        const pm=document.getElementById('playerMeta');
        if(pm) pm.textContent=(p.squadra||'')+(p.valutazione?' · VAL '+p.valutazione:'');
        const cb=document.getElementById('currentBid');
        if(cb) cb.textContent=s.currentAuction.currentBid;
        const cb2=document.getElementById('currentBidder');
        if(cb2) cb2.textContent=s.currentAuction.currentBidder||'—';
        const st=document.getElementById('myStatus');
        if(st){
          st.classList.remove('hidden');
          if(myT && s.currentAuction.currentBidder===myTeam){ st.textContent='MIGLIOR OFFERTA!'; st.className='status win'; }
          else if(s.currentAuction.currentBidder){ st.textContent='OFFERTA SUPERATA'; st.className='status lose'; }
          else { st.textContent='NESSUNA OFFERTA'; st.className='status lose'; }
        }
        const tm=document.getElementById('timer');
        if(tm) tm.classList.remove('hidden-t');
      } else if(s.pendingSelection){
        // se non sei il chiamante, non mostrare il giocatore
        if(s.pendingSelection.callerTeam!==myTeam){
          if(filled) filled.classList.add('hidden');
          if(empty) { empty.classList.remove('hidden'); empty.textContent='In attesa della prima offerta di ' + s.pendingSelection.callerTeam; }
          const tm=document.getElementById('timer');
          if(tm) tm.classList.add('hidden-t');
          const st=document.getElementById('myStatus');
          if(st) st.classList.add('hidden');
        } else {
          if(empty) empty.classList.add('hidden');
          if(filled) filled.classList.remove('hidden');
          const p=s.pendingSelection.player;
          const img=document.getElementById('playerPhoto');
          if(img){
            if(p.card){ img.src=p.card; img.classList.remove('hidden-img'); img.onerror=function(){ img.classList.add('hidden-img'); }; } else img.classList.add('hidden-img');
          }
          const pill=document.getElementById('rolePill');
          if(pill){ pill.textContent=p.ruolo; pill.className='pill '+p.ruolo; }
          const pn=document.getElementById('playerName');
          if(pn) pn.textContent=p.nome;
          const pm=document.getElementById('playerMeta');
          if(pm) pm.textContent=(p.squadra||'')+(p.valutazione?' · VAL '+p.valutazione:'');
          const cb=document.getElementById('currentBid');
          if(cb) cb.textContent='—';
          const cb2=document.getElementById('currentBidder');
          if(cb2) cb2.textContent='—';
          const st=document.getElementById('myStatus');
          if(st){
            st.classList.remove('hidden');
            st.textContent='GIOCATORE SELEZIONATO IN ATTESA DI OFFERTA';
            st.className='status win';
          }
          const tm=document.getElementById('timer');
          if(tm){ tm.classList.add('hidden-t'); tm.textContent='--'; }
        }
      } else {
        if(filled) filled.classList.add('hidden');
        if(empty) empty.classList.remove('hidden');
        const tm=document.getElementById('timer');
        if(tm) tm.classList.add('hidden-t');
        const st=document.getElementById('myStatus');
        if(st) st.classList.add('hidden');
      }
      if(myT){
        const cr=document.getElementById('myCredits');
        if(cr) cr.textContent=myT.credits;
        const mxEl=document.getElementById('myMax');
        if(mxEl){
          const totalMin=Object.values(ROLE_MIN).reduce((a,b)=>a+b,0);
          const remaining=totalMin - myT.squad.length;
          const maxVal=Math.max(0, myT.credits - Math.max(0, remaining - 1));
          mxEl.textContent=maxVal;
        }
        // slot disponibili per ruolo — visibile anche prima dell'avvio
        const slotsBar=document.getElementById('mySlotsBar');
        if(slotsBar){
          const by={}; myT.squad.forEach(function(p){ by[p.ruolo]=(by[p.ruolo]||0)+1; });
          const totalSlots2=Object.values(ROLE_SLOTS).reduce(function(a,b){return a+b;},0);
          let html='';
          ROLES.forEach(function(r){
            const c=by[r]||0, max=ROLE_SLOTS[r]||0, min=ROLE_MIN[r]||0;
            let cls='low';
            if(max && c>=max) cls='full';
            else if(c>=min) cls='ok';
            html+='<div class="s '+cls+'">'+r+' '+c+'/'+max+'</div>';
          });
          html+='<div class="s '+(myT.squad.length>=totalSlots2?'full':'low')+'">TOT '+myT.squad.length+'/'+totalSlots2+'</div>';
          slotsBar.innerHTML=html;
        }
        const el=document.getElementById('mySquad');
        if(el){
          if(!myT.squad.length) el.innerHTML='<div class="empty">Nessun giocatore acquistato</div>';
          else {
            let h='';
            ROLES.forEach(function(r){
              const pls=myT.squad.filter(function(p){return p.ruolo===r;});
              const max=ROLE_SLOTS[r]||0;
              const min=ROLE_MIN[r]||0;
              let col='var(--muted)';
              if(max && pls.length>=max) col='var(--accent)';
              else if(pls.length>=min) col='var(--gold)';
              h+='<div class="group"><div class="group-h"><span class="pill '+r+'" style="font-size:8px;padding:2px 6px">'+r+'</span> '+ROLE_NAMES[r]+'</div>';
              if(!pls.length) h+='<div class="empty">Nessun giocatore</div>';
              else pls.forEach(function(p){ h+='<div class="chip"><span>'+p.nome+'</span><span class="pr">'+p.prezzo+'</span></div>'; });
              h+='</div>';
            });
            el.innerHTML=h;
          }
        }
      }
    }catch(e){ console.error('state handler',e); }
  });
  socket.on('tick', function(d){
    const e=document.getElementById('timer');
    if(!e) return;
    e.textContent=d.secondsLeft;
    e.classList.toggle('danger', d.secondsLeft<=3);
  });
})();
</script>
</body>
</html>
